# Original REALIO=4 layout, not a Joshua ROM or reset-vector image.
# Low memory contains initial data AND writable routines, so emit it separately.
MEMORY {
    LOW: start = $0000, size = $0200, file = "m6502-lowram.bin";
    ROM: start = $0800, size = $2200, file = %O;
}
SEGMENTS {
    LOWRAM: load = LOW, type = rw;
    BASIC:  load = ROM, type = ro;
}
