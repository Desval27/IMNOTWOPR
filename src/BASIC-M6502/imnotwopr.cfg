# IMNOTWOPR map matching the Forth port. ROM is one 16 KiB image.
MEMORY {
    LOW:     start = $0000, size = $0200, type = rw, file = "";
    INPUT:   start = $0200, size = $0200, type = rw, file = "";
    SERIAL:  start = $0400, size = $0200, type = rw, file = "";
    RAM:     start = $0600, size = $AA00, type = rw, file = "";
    VIA:     start = $B000, size = $0010, type = rw, file = "";
    ACIA:    start = $B010, size = $0004, type = rw, file = "";
    ROM:     start = $C000, size = $3FFA, type = ro, file = %O, fill = yes, fillval = $FF;
    VECTORS: start = $FFFA, size = $0006, type = ro, file = %O;
}
SEGMENTS {
    BASIC:   load = ROM, type = ro;
    PLATFORM: load = ROM, type = ro;
    LOWRAM:  load = ROM, run = LOW, type = rw, define = yes;
    SERIAL:  load = SERIAL, type = bss;
    VECTORS: load = VECTORS, type = ro;
}
