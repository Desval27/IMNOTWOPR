MEMORY {
    ZP:          start = $0000, size = $0100, type = rw, define = yes;
    STACK:       start = $0100, size = $0100, type = rw, define = yes;
    KERNAL_RAM:  start = $0200, size = $0400, type = rw, define = yes;
    USER_RAM:    start = $0600, size = $0200, type = rw, define = yes;
    FORTH_RAM:   start = $0800, size = $0800, type = rw, define = yes;
    DICT_RAM:    start = $1000, size = $A000, type = rw, define = yes;
    VIA:         start = $B000, size = $0010, type = rw, define = yes;
    ACIA:        start = $B010, size = $0010, type = rw, define = yes;
    # Forth and IMNOTWOPR support routines share ROM; reserve the CPU vectors.
    PROGRAM_ROM: start = $C000, size = $3FFA, type = ro, file = %O, fill = yes;
    VECTS:       start = $FFFA, size = $0006, type = ro, file = %O, fill = yes; 
}

SEGMENTS {
    ZEROPAGE    : load = ZP, type = zp;
    KERNAL_BSS  : load = KERNAL_RAM, type = bss, define = yes; 
    BSS         : load = USER_RAM, type = bss, define = yes;
    VIA         : load = VIA, type = bss, optional = yes;
    ACIA        : load = ACIA, type = bss, optional = yes;  
    PROGRAM_CODE: load = PROGRAM_ROM, type = ro;
    KERNAL_CODE : load = PROGRAM_ROM, type = ro;
    RODATA      : load = PROGRAM_ROM, type = ro;
    VECTORS     : load = VECTS, type = ro;
}
