# Linker configuration for a custom 6502 system
# RAM: $0000-$3FFF | VIA: $8000 | ACIA: $8010 | ROM: $C000-$FFFF

MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, define = yes;
    RAM:    start = $0200, size = $3E00, type = rw, define = yes;
    VIA:    start = $8000, size = $0010, type = rw, define = yes;
    ACIA:   start = $8010, size = $0010, type = rw, define = yes;
    ROM:    start = $C000, size = $3FFA, type = ro, file = %O, fill = yes;
    VECTS:  start = $FFFA, size = $0006, type = ro, file = %O, fill = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    BSS:      load = RAM,   type = bss, define = yes;
    VIA:      load = VIA,   type = bss, optional = yes;
    ACIA:     load = ACIA,  type = bss, optional = yes;
    CODE:     load = ROM,   type = ro;
    RODATA:   load = ROM,   type = ro;
    DATA:     load = ROM,   run = RAM,  type = rw,  define = yes;
    VECTORS:  load = VECTS, type = ro;
}

